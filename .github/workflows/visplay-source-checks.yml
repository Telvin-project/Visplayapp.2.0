name: VisPlay source checks (no deployment)

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

concurrency:
  group: visplay-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: test
      VISPLAY_DEPLOYMENT_STAGE: local
    steps:
      - name: Check out candidate source
        uses: actions/checkout@v6
      - name: Install Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Install locked web dependencies
        run: npm ci
      - name: Check Typescript, source policy tests and web build
        run: npm run test:all

# Intentionally no provider credentials, database migration, automatic deploy,
# mobile signing, production data, refund, payout, or media deletion step.
# This is a convenient repeatable source-quality gate, not launch approval.
